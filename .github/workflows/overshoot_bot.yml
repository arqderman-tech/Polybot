```yaml
name: Overshoot Bot — cada 3 horas

on:
  schedule:
    # Corre a las 0, 3, 6, 9, 12, 15, 18, 21 UTC
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:   # también se puede triggear manualmente desde GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      # Restaurar la base de datos y CSVs del artifact anterior
      - name: Restaurar DB y CSVs previos
        uses: actions/cache@v4
        with:
          path: |
            pwbot_overshoot.db
            pwbot_overshoot_positions.csv
            pwbot_overshoot_closed.csv
          key: overshoot-data-${{ github.run_id }}
          restore-keys: |
            overshoot-data-

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr bot
        run: python pwbot_overshoot.py

      # Guardar el log como artifact descargable
      - name: Subir log como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overshoot-log-${{ github.run_number }}
          path: pwbot_overshoot.log
          retention-days: 30

      # Subir positions CSV como artifact descargable
      - name: Subir posiciones abiertas como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: positions-${{ github.run_number }}
          path: |
            pwbot_overshoot_positions.csv
            pwbot_overshoot_closed.csv
          retention-days: 90

      # Commitear el CSV actualizado de vuelta al repo
      - name: Commitear CSVs al repositorio
        run: |
          git config --global user.email "bot@pwbot-overshoot"
          git config --global user.name "Overshoot Bot"
          git add pwbot_overshoot_positions.csv pwbot_overshoot_closed.csv index.html closed.html sandbox.html || true
          git diff --staged --quiet || git commit -m "📊 Auto-update positions + dashboard [run #${{ github.run_number }}]"
          git push || echo "Nada que pushear"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
