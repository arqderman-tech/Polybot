name: Overshoot Bot - cada 3 horas

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

concurrency:
  group: overshoot-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restaurar DB y CSVs previos
        uses: actions/cache@v4
        with:
          path: |
            pwbot_overshoot.db
            pwbot_overshoot_positions.csv
            pwbot_overshoot_closed.csv
          key: overshoot-data-${{ github.run_id }}
          restore-keys: |
            overshoot-data-

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-requests-${{ runner.os }}

      - name: Instalar dependencias
        run: pip install requests

      - name: Migrar posiciones sandbox en DB
        run: python3 migrate_sandbox.py

      - name: Correr bot
        run: python pwbot_overshoot.py

      - name: Subir log como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overshoot-log-${{ github.run_number }}
          path: pwbot_overshoot.log
          retention-days: 30

      - name: Subir posiciones como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: positions-${{ github.run_number }}
          path: |
            pwbot_overshoot_positions.csv
            pwbot_overshoot_closed.csv
          retention-days: 90

      - name: Publicar HTML y guardar CSVs
        run: |
          git config --global user.email "bot@pwbot-overshoot"
          git config --global user.name "Overshoot Bot"

          cp index.html   /tmp/index.html
          cp closed.html  /tmp/closed.html
          cp sandbox.html /tmp/sandbox.html
          cp pwbot_overshoot_positions.csv /tmp/positions.csv
          cp pwbot_overshoot_closed.csv    /tmp/closed.csv

          git fetch origin gh-pages
          git checkout -f gh-pages

          cp /tmp/index.html   index.html
          cp /tmp/closed.html  closed.html
          cp /tmp/sandbox.html sandbox.html

          git add index.html closed.html sandbox.html
          git diff --staged --quiet || git commit -m "📊 Dashboard update [run #${{ github.run_number }}]"
          git pull --rebase origin gh-pages || true
          git push origin gh-pages

          git checkout -f main

          cp /tmp/positions.csv pwbot_overshoot_positions.csv
          cp /tmp/closed.csv    pwbot_overshoot_closed.csv

          git add -f pwbot_overshoot_positions.csv pwbot_overshoot_closed.csv
          git diff --staged --quiet || git commit -m "📦 Data update [run #${{ github.run_number }}]"
          git pull --rebase origin main || true
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
